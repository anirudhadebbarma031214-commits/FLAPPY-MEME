<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101426"><title>FLAPPY MEME — India vs USA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28315c,#101426 65%);font-family:system-ui,sans-serif;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(100%,520px);text-align:center}.brand{font-size:clamp(26px,7vw,42px);font-weight:1000;letter-spacing:-1.8px;margin:0;text-shadow:0 0 24px #55e7ff55}.brand span{color:#55e7ff}.sub{color:#bac5e5;margin:5px 0 16px;font-size:13px;letter-spacing:2px;text-transform:uppercase}.gamebox{border:1px solid #7183bd66;border-radius:22px;overflow:hidden;box-shadow:0 22px 80px #0008;background:#141c36}canvas{display:block;width:100%;height:auto;aspect-ratio:420/640;touch-action:manipulation}.hud{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:#0d1227;border-top:1px solid #ffffff17;align-items:center}.pill{border:1px solid #ffffff24;background:#ffffff09;padding:8px 11px;border-radius:12px;font-size:12px;color:#cbd5e1}.pill b{color:white}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;color:white;border:1px solid #ffffff2b;background:#1c2543;border-radius:12px;padding:11px 15px;cursor:pointer}button.primary{background:linear-gradient(120deg,#00a9cf,#7357ff);font-weight:800;border:0}.hint{font-size:12px;color:#aeb9d8;margin:13px 0 0}.foot{font-size:10px;color:#7784aa;margin-top:13px}
</style></head><body><main class="wrap"><h1 class="brand">FLAPPY <span>MEME</span></h1><p class="sub">🇮🇳 India vs USA 🇺🇸 · Meme arcade</p>
<div class="gamebox"><canvas id="game" width="420" height="640" aria-label="Flappy Meme game"></canvas><div class="hud"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">BEST <b id="best">0</b></div><div class="pill"><select id="mode" aria-label="Sound mode"><option value="mix">🇮🇳🇺🇸 Mix sounds</option><option value="india">🇮🇳 India</option><option value="usa">🇺🇸 USA</option><option value="silent">🔇 Silent</option></select></div></div></div>
<div class="controls"><button class="primary" id="start">▶ START GAME</button><button id="sound">🔊 SOUND ON</button></div><p class="hint">Tap / click the game or press SPACE to flap. Dodge the pipes!</p><p class="foot">Original meme-inspired arcade game · Made for the web</p></main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startBtn=document.getElementById('start'),modeEl=document.getElementById('mode'),soundBtn=document.getElementById('sound');
let state='ready',bird={x:105,y:300,vy:0,rot:0},pipes=[],score=0,frame=0,best=0,soundOn=true,audio=null,particles=[];
try{best=Number(localStorage.getItem('flappyMemeBest')||0)}catch{}bestEl.textContent=best;
const rnd=(a,b)=>a+Math.random()*(b-a);
function beep(freq=500,dur=.1,type='sine'){if(!soundOn||modeEl.value==='silent')return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function meme(){if(!soundOn||modeEl.value==='silent')return;const india=['ARE BHAI!','OHH BHAI!','KYA BAAT!'],usa=['LET’S GOO!','BRUH!','NO WAY!'],arr=modeEl.value==='india'?india:modeEl.value==='usa'?usa:(Math.random()<.5?india:usa);if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(arr[Math.floor(Math.random()*arr.length)]);u.rate=1.15;u.pitch=1.2;u.volume=.65;speechSynthesis.speak(u)}}
function reset(){bird={x:105,y:300,vy:0,rot:0};pipes=[];particles=[];score=0;frame=0;scoreEl.textContent=0;state='playing';startBtn.textContent='↻ RESTART';flap()}
function flap(){bird.vy=-6.5;beep(620,.07,'triangle');for(let i=0;i<5;i++)particles.push({x:bird.x-10,y:bird.y+5,vx:rnd(-2,0),vy:rnd(-1,2),life:20})}
function action(){if(state==='over'){reset();return}if(state==='ready'){state='playing';startBtn.textContent='↻ RESTART'}flap()}
c.addEventListener('pointerdown',e=>{e.preventDefault();action()});startBtn.addEventListener('click',reset);soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel()});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)action()}});
function rr(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#202a59');g.addColorStop(.7,'#5b75a3');g.addColorStop(1,'#f0bd8b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){let x=((i*103-frame*.25)%(W+100)+W+100)%(W+100)-40;rr(x,85+(i%3)*48,65,17,10,'#ffffff20');rr(x+18,72+(i%3)*48,35,22,10,'#ffffff20')}ctx.fillStyle='#394d63';ctx.beginPath();ctx.moveTo(0,480);for(let x=0;x<=W;x+=45)ctx.lineTo(x,430+Math.sin(x*.025+frame*.008)*25);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#263c3b';ctx.fillRect(0,565,W,75);ctx.fillStyle='#a6d75c';ctx.fillRect(0,565,W,9);ctx.fillStyle='#f6d78b';for(let x=-(frame*2%48);x<W;x+=48)ctx.fillRect(x,605,25,4)}
function drawPipe(p){let grad=ctx.createLinearGradient(p.x,0,p.x+58,0);grad.addColorStop(0,'#167b58');grad.addColorStop(.25,'#42d991');grad.addColorStop(1,'#146449');ctx.fillStyle=grad;ctx.fillRect(p.x,0,58,p.top);ctx.fillRect(p.x,p.bottom,58,H-p.bottom-75);rr(p.x-6,p.top-22,70,22,5,'#36c982');rr(p.x-6,p.bottom,70,22,5,'#36c982');ctx.fillStyle='#ffffff30';ctx.fillRect(p.x+10,0,5,p.top-22);ctx.fillRect(p.x+10,p.bottom+22,5,H-p.bottom-97)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.shadowColor='#ffcc55';ctx.shadowBlur=15;ctx.fillStyle='#ffbd3f';ctx.beginPath();ctx.ellipse(0,0,22,18,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffdf73';ctx.beginPath();ctx.ellipse(-5,5,12,9,-.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10,-7,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(13,-7,3.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff6d48';ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(32,4);ctx.lineTo(19,8);ctx.fill();ctx.fillStyle='#f58b25';ctx.beginPath();ctx.ellipse(-7,2,9,5,Math.sin(frame*.25)*.3,0,Math.PI*2);ctx.fill();ctx.restore()}
function overlay(title,sub){ctx.fillStyle='#080d20a8';ctx.fillRect(25,220,370,150);ctx.strokeStyle='#ffffff50';ctx.strokeRect(25,220,370,150);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 30px system-ui';ctx.fillText(title,W/2,270);ctx.fillStyle='#d8e5ff';ctx.font='15px system-ui';ctx.fillText(sub,W/2,305);ctx.font='12px system-ui';ctx.fillText('TAP / CLICK OR PRESS SPACE',W/2,337)}
function collide(){const bx=bird.x,by=bird.y;if(by>552||by<7)return true;for(const p of pipes){if(bx+15>p.x&&bx-15<p.x+58&&(by-13<p.top||by+13>p.bottom))return true}return false}
function tick(){frame++;drawBg();if(state==='playing'){bird.vy+=.34;bird.y+=bird.vy;bird.rot=Math.min(.8,Math.max(-.5,bird.vy*.08));if(frame%92===0){const top=rnd(100,300);pipes.push({x:W+10,top:top,bottom:top+rnd(140,165),passed:false})}for(const p of pipes){p.x-=2.65;if(!p.passed&&p.x+58<bird.x){p.passed=true;score++;scoreEl.textContent=score;beep(800,.08);meme()}}pipes=pipes.filter(p=>p.x>-80);if(collide()){state='over';beep(130,.25,'sawtooth');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('flappyMemeBest',best)}catch{}}startBtn.textContent='↻ PLAY AGAIN'}}
for(const p of pipes)drawPipe(p);for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.life--;ctx.globalAlpha=Math.max(0,q.life/20);ctx.fillStyle='#ffe17b';ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill();ctx.globalAlpha=1}particles=particles.filter(q=>q.life>0);drawBird();if(state==='ready')overlay('FLAPPY MEME','A tiny bird. A huge meme journey.');if(state==='over')overlay('GAME OVER','Score: '+score+' · Best: '+best);requestAnimationFrame(tick)}
tick();
})();
</script></body></html>
